name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "ielts-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "ielts-frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: ielts-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ielts-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
