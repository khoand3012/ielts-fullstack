name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "ielts-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "ielts-backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: ielts-backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: ielts-backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -v
