services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
      POSTGRES_DB: ielts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts"]
      interval: 2s
      timeout: 5s
      retries: 15

  # minio/minio was removed from Docker Hub; Bitnami's frozen build is the same server.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ielts-assets
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data

  # One-shot, like the Fly release command: migrations never run on API boot.
  migrate:
    build: .
    image: ielts-backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@postgres:5432/ielts
    depends_on:
      postgres:
        condition: service_healthy

  # R2_ENDPOINT_URL stays http://localhost:9000 from .env, because the browser must reach the
  # URLs the API signs with it. The API's own reads (the Writing chart sent to the AI grader)
  # go to MinIO by its service name instead. Uploads happen in `core.cli load-test`, which
  # runs on the host.
  api:
    build: .
    image: ielts-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@postgres:5432/ielts
      R2_INTERNAL_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
